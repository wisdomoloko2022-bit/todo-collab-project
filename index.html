<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>
<body>
    <header>
        <h1>Daily Planner</h1>
        <p>Organize your day, one task at a time.</p>
    </header>
   <main class="todo-container">
   <section class="input-section">
    <label for="taskInput" class="sr-only">New Task</label>
    <input type="text" id="taskInput" placeholder="Write something you want to do..." disabled>
    <button id="addBtn" disabled>Add</button>
   </section>
   
   <section class="task-section">
    <h2>My Tasks</h2>
    <ul id="taskList">
        <li>Finish web development project</li>
        <li>Read 2 chapters of Javascript guide</li>
        <li>Take a short break and Relax</li>
    </ul>
   </section>
   </main>

   <footer>
    <p>Built by Dorcas and Wisdom with love | 2025</p>
   </footer>
</body>
</html>
